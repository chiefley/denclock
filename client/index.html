<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>DenClock</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="clock.css">
  <link rel="stylesheet" href="background.css">
</head>
<body>
  <div class="display-background" aria-hidden="true"></div>
  <section class="sensors" aria-label="Primary sensor readings">
    <section class="sensor-panel" id="upperLeft" aria-label="Unassigned sensor">
      <div class="temperature"><span class="temperature-whole">--</span><span class="temperature-fraction">.-</span><span class="temperature-unit"></span></div>
      <div class="sensor-details"><span class="sensor-name"></span><span aria-hidden="true"> · </span><span class="humidity"><span class="humidity-value">--</span> RH</span></div>
    </section>
    <section class="sensor-panel" id="upperRight" aria-label="Unassigned sensor">
      <div class="temperature"><span class="temperature-whole">--</span><span class="temperature-fraction">.-</span><span class="temperature-unit"></span></div>
      <div class="sensor-details"><span class="sensor-name"></span><span aria-hidden="true"> · </span><span class="humidity"><span class="humidity-value">--</span> RH</span></div>
    </section>
  </section>
  <main class="clock" aria-label="Clock">
    <div class="time"><span id="hours-minutes">--:--</span><span id="seconds">--</span></div>
    <div id="date" class="date"></div>
    <div id="sync-status" class="sync-status" role="status">Waiting for time</div>
  </main>
  <button id="settings-button" class="settings-button" type="button" aria-label="Settings" aria-haspopup="dialog" aria-controls="settings-view">⚙</button>
  <dialog id="settings-view" aria-labelledby="settings-title" aria-describedby="settings-status">
    <form id="settings-form" novalidate>
      <h1 id="settings-title">Display settings</h1>
      <p id="settings-status" role="status" tabindex="-1">Loading settings…</p>
      <button id="settings-reload" type="button" hidden>Reload service settings (discard draft)</button>
      <label for="settings-unit">Temperature unit</label>
      <select id="settings-unit" name="temperatureUnit" disabled>
        <option value="C">Celsius (°C)</option><option value="F">Fahrenheit (°F)</option>
      </select>
      <div class="settings-positions">
        <fieldset class="settings-fields" disabled>
          <legend>Upper-left sensor</legend>
          <label for="settings-left-sensor">Sensor assignment</label>
          <select id="settings-left-sensor" name="leftSensor">
            <option value="">Unassigned</option>
          </select>
          <label for="settings-left-label">Display label</label>
          <input id="settings-left-label" name="leftLabel" type="text" disabled>
          <label for="settings-left-age">Stale-reading limit (seconds)</label>
          <input id="settings-left-age" name="leftAge" type="number" disabled inputmode="decimal" step="any">
        </fieldset>
        <fieldset class="settings-fields" disabled>
          <legend>Upper-right sensor</legend>
          <label for="settings-right-sensor">Sensor assignment</label>
          <select id="settings-right-sensor" name="rightSensor">
            <option value="">Unassigned</option>
          </select>
          <label for="settings-right-label">Display label</label>
          <input id="settings-right-label" name="rightLabel" type="text" disabled>
          <label for="settings-right-age">Stale-reading limit (seconds)</label>
          <input id="settings-right-age" name="rightAge" type="number" disabled inputmode="decimal" step="any">
        </fieldset>
      </div>
      <fieldset class="settings-fields mapping-fields" disabled>
        <legend>Sensor mappings</legend>
        <div id="settings-sensors"></div>
        <button id="settings-add-sensor" type="button">Add sensor</button>
      </fieldset>
      <fieldset class="settings-fields mapping-fields" disabled>
        <legend>Gateway names (optional)</legend>
        <div id="settings-gateways"></div>
        <button id="settings-add-gateway" type="button">Add gateway</button>
      </fieldset>
      <div class="settings-actions">
        <button id="settings-save" type="submit" disabled>Save</button>
        <button id="settings-cancel" type="button">Cancel</button>
      </div>
    </form>
  </dialog>
  <script type="module">
    import { initializeSettings } from './settings.js';

    import { config } from './config.js';
    import { serverAddress } from './client-settings.js';
    import { TimeClient, ClockDisplay } from './clock.js';
    import { PresentationClient, SensorDisplay } from './presentation.js';

    const timeClient = new TimeClient({ ...config, serverAddress });
    const display = new ClockDisplay(timeClient, document);
    timeClient.start();
    display.start();
    const presentation = new PresentationClient({ ...config, serverAddress });
    presentation.start();
    new SensorDisplay(presentation, document).start();
    initializeSettings(document, { ...config, serverAddress }, () => presentation.refresh());
  </script>
</body>
</html>
